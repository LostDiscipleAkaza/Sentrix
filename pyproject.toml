[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconnoiter"
version = "2.0.0"
description = "Advanced network reconnaissance and vulnerability assessment pipeline"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Reconnoiter Team"}
]
keywords = ["reconnaissance", "security", "scanner", "cve", "dns", "nvd", "epss", "cisa-kev"]
dependencies = [
    "requests>=2.31.0",
    "dnspython>=2.4.0",
    "python-nmap>=0.7.1"
]

[project.scripts]
reconnoiter = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "resolver",
    "host_discovery",
    "scanner",
    "banner_grabber",
    "cve_lookup",
    "dns_enum",
    "report",
    "utils"
]

